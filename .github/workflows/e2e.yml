# Runs this action on pull requests that change tests/e2e, the way users run it.
name: e2e

on:
  pull_request:
    paths: ["tests/e2e/**", "action.yml", "check.py", "public_api.py"]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        id: check
        with:
          source: tests/e2e
      - run: echo "removed=${{ steps.check.outputs.removed }} used=${{ steps.check.outputs.used }}"
